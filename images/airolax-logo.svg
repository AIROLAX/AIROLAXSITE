<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Top A -->
  <rect x="16" y="4" width="8" height="12" fill="#111111" rx="2" />
  <rect x="18" y="6" width="4" height="8" fill="#111111" />
  
  <!-- Right A (rotated 90 degrees) -->
  <rect x="24" y="16" width="12" height="8" fill="#111111" rx="2" transform="rotate(90 30 20)" />
  <rect x="26" y="18" width="8" height="4" fill="#111111" transform="rotate(90 30 20)" />
  
  <!-- Bottom A (rotated 180 degrees) -->
  <rect x="16" y="24" width="8" height="12" fill="#111111" rx="2" transform="rotate(180 20 30)" />
  <rect x="18" y="26" width="4" height="8" fill="#111111" transform="rotate(180 20 30)" />
  
  <!-- Left A (rotated -90 degrees) -->
  <rect x="4" y="16" width="12" height="8" fill="#111111" rx="2" transform="rotate(-90 10 20)" />
  <rect x="6" y="18" width="8" height="4" fill="#111111" transform="rotate(-90 10 20)" />
  
  <!-- Center square -->
  <rect x="18" y="18" width="4" height="4" fill="#111111" />
</svg>
