<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andata Lab — Immersive & Creative Technology Studio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: #fff; }
  .nav-link:hover { opacity: .65; }

  /* cinematic scroll-reveal — slow, intentional pacing */
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 1s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1); }
  .reveal.in { opacity: 1; transform: none; }
  /* hero entrance */
  @keyframes heroIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .hero-in { opacity: 0; animation: heroIn 1.1s cubic-bezier(.16,1,.3,1) forwards; }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .hero-in { opacity: 1 !important; transform: none !important; animation: none !important; }
  }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-primary:active { transform: scale(.98); }
  .hero-ghost:hover { background: rgba(255,255,255,.16) !important; border-color: #fff !important; }
  .work-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lift) !important; }
  .work-card:hover .work-img { transform: scale(1.05); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #D2D2D7; border-radius: 999px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="sections-top.jsx"></script>
<script type="text/babel" src="sections-mid.jsx"></script>
<script type="text/babel" src="sections-end.jsx"></script>
</body>
</html>
