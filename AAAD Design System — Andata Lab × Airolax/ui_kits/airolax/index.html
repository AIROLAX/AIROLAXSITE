<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIROLAX — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; background: #000; }
  #root { min-height: 100vh; }
  @keyframes xbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  .x-chan:hover { color: #fff !important; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #2a2a2c; border-radius: 999px; }
  [style*="scrollbar-width"]::-webkit-scrollbar { display: none; }
  .gal-chips::-webkit-scrollbar { display: none; }

  /* Immersive Index — draggable canvas */
  .gal-stage { position: relative; height: 74vh; min-height: 460px; margin-top: 22px; overflow: hidden; cursor: grab; user-select: none; touch-action: none; background: #000; }
  .gal-stage.dragging { cursor: grabbing; }
  .gal-stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6; box-shadow: inset 0 0 110px 42px #000; }
  .gal-stage.dragging .gal-frame:hover img { transform: none; }
  .gal-stage.dragging .gal-caption { opacity: 0; }
  .gal-grid { position: absolute; top: 0; left: 0; column-gap: 16px; padding: 10px; will-change: transform; }
  .gal-tile { break-inside: avoid; margin: 0 0 16px; }
  .gal-hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 7; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; pointer-events: none; transition: opacity .5s; }
  .gal-hint.gone { opacity: 0; }
  .gal-frame { position: relative; width: 100%; overflow: hidden; border-radius: 12px; background: linear-gradient(135deg, #17171a 0%, #0d0d0f 100%); outline: 1px solid rgba(255,255,255,.06); outline-offset: -1px; }
  .gal-frame img { transition: transform .6s cubic-bezier(.22,.61,.36,1), filter .4s; }
  .gal-frame:hover img { transform: scale(1.05); }
  .gal-caption { position: absolute; left: 12px; right: 12px; bottom: 11px; z-index: 2; display: flex; flex-direction: column; gap: 2px; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; text-shadow: 0 1px 8px rgba(0,0,0,.9); }
  .gal-frame:hover .gal-caption { opacity: 1; transform: none; }
  .gal-frame::after { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0) 46%); opacity: 0; transition: opacity .3s; pointer-events: none; }
  .gal-frame:hover::after { opacity: 1; }
  .gal-spec { position: absolute; left: 0; bottom: 0; z-index: 2; height: 2px; width: 0; background: var(--spectrum, linear-gradient(90deg,#3CDCFF,#FF2E8A,#FF8A3C)); transition: width .45s cubic-bezier(.22,.61,.36,1); }
  .gal-frame:hover .gal-spec { width: 100%; }
  @media (prefers-reduced-motion: reduce) { .gal-frame img, .gal-frame:hover img { transition: none; transform: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="core.jsx"></script>
<script type="text/babel" src="work.jsx"></script>
<script type="text/babel" src="gallery.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
