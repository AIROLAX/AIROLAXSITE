<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .card{background:#000;padding:30px 34px;font-family:'Inter',sans-serif;display:flex;flex-direction:column;gap:16px}
  .cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#A1A1A6;margin:0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11px;font-weight:500;letter-spacing:.04em;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.14)}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}
  .dot{width:7px;height:7px;border-radius:50%;background:#FF2E8A;box-shadow:0 0 8px #FF2E8A}
  .spec{padding:7px 13px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#000;background:linear-gradient(90deg,#3CDCFF,#FF2E8A,#FF8A3C)}
</style>
</head>
<body>
<div class="card">
  <p class="cap">Airolax · tags & status</p>
  <div class="row">
    <span class="tag">Projection Mapping</span>
    <span class="tag">AI + Interactive</span>
    <span class="live"><span class="dot"></span>Real-time</span>
    <span class="spec">Selected</span>
  </div>
</div>
</body>
</html>
