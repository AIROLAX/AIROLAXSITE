<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .wrap{display:grid;grid-template-columns:1fr 1fr;font-family:'Inter',sans-serif}
  .pane{padding:28px 30px;display:flex;flex-direction:column;gap:12px}
  .light{background:#fff}.dark{background:#000}
  label{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
  .light label{color:#6E6E73}.dark label{color:#A1A1A6}
  input{font-family:inherit;font-size:14px;padding:13px 15px;border-radius:10px;outline:none;transition:.2s;width:100%;box-sizing:border-box}
  .light input{background:#fff;border:1px solid #D2D2D7;color:#111}
  .light input:focus{border-color:#111}
  .dark input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:#fff}
  .dark input:focus{border-color:transparent;box-shadow:0 0 0 1.5px #3CDCFF}
  ::placeholder{color:#8E8E93}
</style>
</head>
<body>
<div class="wrap">
  <div class="pane light"><label>Your name</label><input placeholder="Studio or company"><label>Email</label><input placeholder="you@studio.com"></div>
  <div class="pane dark"><label>Your name</label><input placeholder="Tell me who you are"><label>Email</label><input placeholder="you@email.com"></div>
</div>
</body>
</html>
