<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{display:grid;grid-template-columns:1fr 1fr;font-family:var(--font)}
  .cell{display:flex;align-items:center;gap:22px;padding:30px 34px;min-height:150px;box-sizing:border-box}
  .cell img{width:78px;height:78px}
  .name{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
  .sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}
  .light{background:#fff;color:#111}
  .light .sub{color:#6E6E73}
  .dark{background:#000;color:#fff}
  .dark .sub{color:#A1A1A6}
  .star{font-size:.6em;vertical-align:super}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell light">
    <img src="../assets/logo-mark-black.png" alt="AAAD mark">
    <div><div class="name">Andata&nbsp;Lab<span class="star">*</span></div><div class="sub">Studio · Light</div></div>
  </div>
  <div class="cell dark">
    <img src="../assets/logo-mark-white.png" alt="AAAD mark">
    <div><div class="name">Airolax</div><div class="sub">Portfolio · Dark</div></div>
  </div>
</div>
</body>
</html>
