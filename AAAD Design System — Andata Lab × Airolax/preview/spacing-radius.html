<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .card{background:#fff;padding:30px 34px;font-family:'Inter',sans-serif}
  .row{display:flex;align-items:flex-end;gap:22px}
  .u{display:flex;flex-direction:column;align-items:center;gap:9px}
  .box{width:62px;height:62px;background:#F5F5F7;border:1px solid #D2D2D7;border-top:2px solid #111}
  .nm{font-size:11px;font-weight:600;color:#111}
  .v{font-size:10.5px;color:#8E8E93;font-variant-numeric:tabular-nums}
  .cap{font-size:11.5px;color:#6E6E73;margin:0 0 16px;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <p class="cap">Corner radius</p>
  <div class="row">
    <div class="u"><div class="box" style="border-radius:6px"></div><span class="nm">xs</span><span class="v">6</span></div>
    <div class="u"><div class="box" style="border-radius:10px"></div><span class="nm">sm</span><span class="v">10</span></div>
    <div class="u"><div class="box" style="border-radius:14px"></div><span class="nm">md</span><span class="v">14</span></div>
    <div class="u"><div class="box" style="border-radius:20px"></div><span class="nm">lg</span><span class="v">20</span></div>
    <div class="u"><div class="box" style="border-radius:28px"></div><span class="nm">xl</span><span class="v">28</span></div>
    <div class="u"><div class="box" style="border-radius:999px"></div><span class="nm">pill</span><span class="v">999</span></div>
  </div>
</div>
</body>
</html>
