<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;background:#000}
  .wrap{display:grid;grid-template-columns:1fr 1fr;min-height:240px}
  .cell{display:flex;align-items:center;justify-content:center;padding:18px}
  .cell img{max-height:200px;max-width:100%;object-fit:contain}
  .cell:first-child{border-right:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell"><img src="../assets/logo-neon.png" alt="AAAD neon render"></div>
  <div class="cell"><img src="../assets/logo-chrome.png" alt="AAAD liquid-chrome render"></div>
</div>
</body>
</html>
