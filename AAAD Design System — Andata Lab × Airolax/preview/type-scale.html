<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .card{background:#000;color:#fff;padding:30px 38px;font-family:var(--font)}
  .row{display:flex;align-items:baseline;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .row:last-child{border-bottom:0}
  .tok{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#A1A1A6;width:112px;flex:none}
  .spec{font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s-display{font-size:34px;font-weight:800}
  .s-h1{font-size:26px}.s-h2{font-size:21px}.s-body{font-size:16px;font-weight:400}
</style>
</head>
<body>
<div class="card">
  <div class="row"><span class="tok">Display 800</span><span class="spec s-display">Immersive</span></div>
  <div class="row"><span class="tok">H1 700</span><span class="spec s-h1">Selected Work</span></div>
  <div class="row"><span class="tok">H2 600</span><span class="spec s-h2">Architectural Mapping</span></div>
  <div class="row"><span class="tok">Body 400</span><span class="spec s-body">Based in Mexico, working worldwide.</span></div>
</div>
</body>
</html>
