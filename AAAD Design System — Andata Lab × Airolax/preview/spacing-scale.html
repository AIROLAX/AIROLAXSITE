<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .card{background:#fff;padding:30px 34px;font-family:'Inter',sans-serif}
  .row{display:flex;align-items:flex-end;gap:16px}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .blk{background:#111;border-radius:3px;width:100%}
  .v{font-size:10.5px;color:#8E8E93;font-variant-numeric:tabular-nums}
  .nm{font-size:11px;font-weight:600;color:#111}
  .cap{font-size:11.5px;color:#6E6E73;margin:0 0 16px;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <p class="cap">8pt grid</p>
  <div class="row">
    <div class="u" style="width:32px"><div class="blk" style="height:4px"></div><span class="nm">1</span><span class="v">4</span></div>
    <div class="u" style="width:40px"><div class="blk" style="height:8px"></div><span class="nm">2</span><span class="v">8</span></div>
    <div class="u" style="width:48px"><div class="blk" style="height:16px"></div><span class="nm">4</span><span class="v">16</span></div>
    <div class="u" style="width:56px"><div class="blk" style="height:24px"></div><span class="nm">5</span><span class="v">24</span></div>
    <div class="u" style="width:64px"><div class="blk" style="height:32px"></div><span class="nm">6</span><span class="v">32</span></div>
    <div class="u" style="width:80px"><div class="blk" style="height:48px"></div><span class="nm">7</span><span class="v">48</span></div>
    <div class="u" style="width:96px"><div class="blk" style="height:64px"></div><span class="nm">8</span><span class="v">64</span></div>
  </div>
</div>
</body>
</html>
