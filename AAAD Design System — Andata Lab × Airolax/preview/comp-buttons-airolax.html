<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .card{background:#000;padding:34px 38px;font-family:'Inter',sans-serif;display:flex;flex-direction:column;gap:16px}
  .cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#A1A1A6;margin:0}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;padding:13px 26px;border-radius:999px;cursor:pointer;border:1px solid transparent;transition:.22s}
  .primary{background:#fff;color:#000}
  .primary:hover{transform:translateY(-2px)}
  .secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
  .secondary:hover{border-color:#fff}
  .spectrum{background:transparent;color:#fff;border:1px solid transparent;background-image:linear-gradient(#000,#000),linear-gradient(90deg,#3CDCFF,#FF2E8A,#FF8A3C);background-origin:border-box;background-clip:padding-box,border-box}
</style>
</head>
<body>
<div class="card">
  <p class="cap">Airolax · Dark</p>
  <div class="row">
    <button class="btn primary">Artworks</button>
    <button class="btn secondary">About</button>
    <button class="btn spectrum">Let's collaborate</button>
  </div>
</div>
</body>
</html>
