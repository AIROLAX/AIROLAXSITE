<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .card{background:#fff;color:#111;padding:34px 38px;font-family:var(--font)}
  .lbl{font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#6E6E73;font-feature-settings:"tnum" 1}
  .row{display:flex;gap:26px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .note{font-size:13px;color:#8E8E93;margin-top:18px;letter-spacing:-.005em}
  .clock{font-variant-numeric:tabular-nums;color:#111;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <span class="lbl">Selected Work</span>
    <span class="lbl">Based In — Mexico</span>
    <span class="lbl">Artist Channels</span>
    <span class="lbl clock">00:00:00 · 2025©</span>
  </div>
  <p class="note">System / HUD label — Inter, uppercase, 0.22em tracking, tabular figures. Replaces the live sites' JetBrains Mono.</p>
</div>
</body>
</html>
