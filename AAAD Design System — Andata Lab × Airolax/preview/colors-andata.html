<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .card{background:#fff;padding:26px 30px;font-family:'Inter',sans-serif}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .sw{display:flex;flex-direction:column;gap:8px}
  .chip{height:64px;border-radius:10px;border:1px solid #D2D2D7}
  .nm{font-size:11px;font-weight:600;color:#111;letter-spacing:.02em}
  .hex{font-size:10.5px;color:#8E8E93;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><span class="nm">bg</span><span class="hex">#FFFFFF</span></div>
    <div class="sw"><div class="chip" style="background:#F5F5F7"></div><span class="nm">surface</span><span class="hex">#F5F5F7</span></div>
    <div class="sw"><div class="chip" style="background:#EBEBEF"></div><span class="nm">surface-2</span><span class="hex">#EBEBEF</span></div>
    <div class="sw"><div class="chip" style="background:#D2D2D7"></div><span class="nm">hair</span><span class="hex">#D2D2D7</span></div>
    <div class="sw"><div class="chip" style="background:#6E6E73"></div><span class="nm">ink-2</span><span class="hex">#6E6E73</span></div>
    <div class="sw"><div class="chip" style="background:#111111"></div><span class="nm">ink</span><span class="hex">#111111</span></div>
  </div>
</div>
</body>
</html>
