<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .card{background:#fff;padding:34px 38px;font-family:'Inter',sans-serif;display:flex;flex-direction:column;gap:16px}
  .cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6E6E73;margin:0}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;padding:13px 26px;border-radius:999px;cursor:pointer;border:1px solid transparent;transition:.22s}
  .primary{background:#000;color:#fff}
  .primary:hover{transform:translateY(-2px)}
  .secondary{background:#fff;color:#111;border-color:#D2D2D7}
  .secondary:hover{border-color:#111}
  .ghost{background:transparent;color:#111;padding:13px 8px;border-radius:0}
  .ghost span{border-bottom:1.5px solid #111;padding-bottom:3px}
</style>
</head>
<body>
<div class="card">
  <p class="cap">Andata Lab · Light</p>
  <div class="row">
    <button class="btn primary">Start a project</button>
    <button class="btn secondary">View work</button>
    <button class="btn ghost"><span>Contact</span></button>
  </div>
</div>
</body>
</html>
