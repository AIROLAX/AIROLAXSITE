<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .card{background:#000;padding:26px 30px;font-family:'Inter',sans-serif}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .sw{display:flex;flex-direction:column;gap:8px}
  .chip{height:64px;border-radius:10px;border:1px solid rgba(255,255,255,.14)}
  .nm{font-size:11px;font-weight:600;color:#fff;letter-spacing:.02em}
  .hex{font-size:10.5px;color:#8E8E93;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#000000"></div><span class="nm">bg</span><span class="hex">#000000</span></div>
    <div class="sw"><div class="chip" style="background:#0C0C0E"></div><span class="nm">surface</span><span class="hex">#0C0C0E</span></div>
    <div class="sw"><div class="chip" style="background:#161617"></div><span class="nm">surface-2</span><span class="hex">#161617</span></div>
    <div class="sw"><div class="chip" style="background:rgba(255,255,255,.14)"></div><span class="nm">hair</span><span class="hex">wht 14%</span></div>
    <div class="sw"><div class="chip" style="background:#A1A1A6"></div><span class="nm">ink-2</span><span class="hex">#A1A1A6</span></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><span class="nm">ink</span><span class="hex">#FFFFFF</span></div>
  </div>
</div>
</body>
</html>
