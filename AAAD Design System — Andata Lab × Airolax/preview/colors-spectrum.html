<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .card{background:#000;padding:30px 34px;font-family:'Inter',sans-serif}
  .bar{height:54px;border-radius:10px;background:linear-gradient(90deg,#3CDCFF 0%,#FF2E8A 52%,#FF8A3C 100%)}
  .stops{display:flex;justify-content:space-between;margin-top:14px}
  .st{display:flex;flex-direction:column;gap:5px}
  .dot{width:14px;height:14px;border-radius:50%}
  .nm{font-size:11px;font-weight:600;color:#fff}
  .hex{font-size:10.5px;color:#8E8E93;font-variant-numeric:tabular-nums}
  .note{font-size:11.5px;color:#A1A1A6;margin-top:16px;letter-spacing:.01em;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="stops">
    <div class="st"><span class="dot" style="background:#3CDCFF"></span><span class="nm">Cyan</span><span class="hex">#3CDCFF</span></div>
    <div class="st"><span class="dot" style="background:#FF2E8A"></span><span class="nm">Magenta</span><span class="hex">#FF2E8A</span></div>
    <div class="st"><span class="dot" style="background:#FF8A3C"></span><span class="nm">Orange</span><span class="hex">#FF8A3C</span></div>
  </div>
  <p class="note">Spectrum — from the neon mark. The system's only chroma. AIROLAX-only, hairline scale: focus rings, 1px gradient rules, active underlines. Never a fill.</p>
</div>
</body>
</html>
