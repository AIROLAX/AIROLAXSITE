<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0}
  .wrap{display:grid;grid-template-columns:1fr 1fr}
  .pane{padding:34px;display:flex;gap:24px;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
  .light{background:#fff}
  .dark{background:#000}
  .card{width:120px;height:78px;border-radius:14px;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font-size:10.5px;font-weight:600}
  .c1{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);color:#6E6E73}
  .c2{background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.06),0 20px 48px rgba(0,0,0,.10);color:#6E6E73}
  .d1{background:#161617;color:#A1A1A6;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 12px 40px rgba(0,0,0,.6)}
  .d2{background:#161617;color:#A1A1A6;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 24px 64px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div class="wrap">
  <div class="pane light"><div class="card c1">card</div><div class="card c2">lift</div></div>
  <div class="pane dark"><div class="card d1">card</div><div class="card d2">lift</div></div>
</div>
</body>
</html>
